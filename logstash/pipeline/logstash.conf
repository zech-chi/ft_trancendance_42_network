input {
  beats {
    port => 5044
  }
}

filter {
  # Map docker container name to 'service'
  mutate {
    copy => { "[container][name]" => "service" }
  }

  mutate {
    add_field => { "environment" => "dev" }
  }

  # Parse nginx container access logs (default format -> message)
  if [service] =~ "nginx" {
    # First, extract METHOD, PATH and HTTP version from the quoted request
    grok {
      match => {
        "message" => [
          # default access log: $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"
          '.*"\s*%{WORD:method}\s+%{URIPATHPARAM:request_path}\s+HTTP/%{NUMBER:http_version}\s*"\s+%{NUMBER:status:int}\s+%{NUMBER:body_bytes_sent:int}\s+"%{DATA:http_referer}"\s+"%{DATA:http_user_agent}"'
        ]
      }
      # don't fail the event if grok misses (e.g., error lines)
      tag_on_failure => []
    }

    # Fallback: if request_path still missing, try to split generic "$request"
    if ![request_path] and [message] =~ /"[^"]+"/ {
      grok {
        match => { "message" => '.*"(?<request>%{DATA})"' }
        tag_on_failure => []
      }
      if [request] {
        dissect {
          mapping => { "request" => "%{method} %{request_path} HTTP/%{http_version}" }
        }
      }
    }

    # Normalize fields
    mutate {
      remove_field => ["request"]        # cleanup temp field if created
    }
  }
}

output {
  if [service] =~ "auth-service" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "auth-logs-%{+YYYY.MM.dd}"
    }
  } else if [service] =~ "chat-service" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "chat-logs-%{+YYYY.MM.dd}"
    }
  } else if [service] =~ "dashboard-service" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "dashboard-logs-%{+YYYY.MM.dd}"
    }
  } else if [service] =~ "ping-pong-service" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "pingpong-logs-%{+YYYY.MM.dd}"
    }
  } else if [service] =~ "parcheesi-service" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "parcheesi-logs-%{+YYYY.MM.dd}"
    }
  } else if [service] =~ "user-service" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "user-logs-%{+YYYY.MM.dd}"
    }
  } else if [service] =~ "db-service" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "db-service-logs-%{+YYYY.MM.dd}"
    }
  } else if [service] =~ "nginx" or [service] == "nginx" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "nginx-logs-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "other-logs-%{+YYYY.MM.dd}"
    }
  }

  stdout { codec => rubydebug }
}