events {
    worker_connections 1024;
}

http {
    # ---------------------------
    # Upstreams
    # ---------------------------
    upstream frontend {
        server frontend:3000;
    }

    upstream gateway {
        server gateway-service:5006;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream prometheus {
        server prometheus:9090;
    }

    upstream kibana {
        server kibana:5601;
    }

    # ---------------------------
    # HTTP → HTTPS redirect
    # ---------------------------
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # ---------------------------
    # HTTPS SERVER
    # ---------------------------
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # ------------------------------------------------------
        # FRONTEND
        # ------------------------------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        # Next.js HMR
        location /_next/webpack-hmr {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ------------------------------------------------------
        # API → Gateway
        # ------------------------------------------------------
        location /api/ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 150M;
        }

        # ------------------------------------------------------
        # SOCKET.IO → Gateway
        # ------------------------------------------------------
        location /socket.io/ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # ------------------------------------------------------
        # GRAFANA (Sub-path: /grafana)
        # ------------------------------------------------------

        # Live WebSockets
        location /grafana/api/live/ {
            proxy_pass http://grafana/api/live/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Main UI
        location /grafana/ {
            proxy_pass http://grafana/grafana/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for Grafana behind sub-path
            proxy_set_header X-Script-Name /grafana;
            proxy_set_header X-Forwarded-Prefix /grafana;
        }

        # ------------------------------------------------------
        # PROMETHEUS (Sub-path: /prometheus)
        # ------------------------------------------------------
        location /prometheus/ {
            proxy_pass http://prometheus/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve static assets
        location /prometheus/static/ {
            proxy_pass http://prometheus/static/;
        }

        # ------------------------------------------------------
        # KIBANA (Sub-path: /kibana)
        # ------------------------------------------------------
        location /kibana/ {
            proxy_pass http://kibana;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout    300;
            proxy_connect_timeout 300;
            proxy_send_timeout    300;
            
            proxy_redirect off;
        }

        # ------------------------------------------------------
        # NGINX STATUS PAGE
        # ------------------------------------------------------
        location /stub_status {
            stub_status on;
            access_log off;
            allow 172.0.0.0/8;
            deny all;
        }
    }
}